<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ver carrito — Leiten</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F4F5F7; --surface: #fff; --border: #E5E7EB;
      --text: #111827; --text-2: #6B7280; --text-3: #9CA3AF;
      --accent: #1B3A6B; --green: #10B981; --yellow: #F59E0B; --red: #EF4444;
      --r: 12px; --r-sm: 8px;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 16px; }
    .card { width: 100%; max-width: 720px; background: transparent; }
    .input-row { display:none; }
    .cart-info { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .cart-id { font-size: 13px; color: var(--text-2); }
    .badge { padding: 3px 10px; border-radius: 100px; font-size: 11px; font-weight: 700; }
    .badge-open { background: #D1FAE5; color: #065F46; }
    .badge-closed { background: #FEE2E2; color: #991B1B; }
    .badge-default { background: #E5E7EB; color: #374151; }
    table { width: 100%; border-collapse: collapse; }
    thead th { padding: 9px 12px; text-align: left; font-size: 11px; font-weight: 700; color: var(--text-2); letter-spacing: .5px; text-transform: uppercase; background: var(--bg); border-bottom: 1px solid var(--border); }
    tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr.removing { opacity: .4; pointer-events: none; }
    tbody td { padding: 10px 12px; font-size: 13px; vertical-align: middle; }
    .name { font-weight: 600; }
    .code { font-family: 'Courier New', monospace; font-size: 11px; color: var(--text-2); margin-top: 2px; }
    .qty-ctrl { display: flex; align-items: center; gap: 6px; justify-content: center; }
    .qty-btn { width: 26px; height: 26px; border-radius: 6px; border: 1.5px solid var(--border); background: var(--surface); color: var(--text); font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: border-color .15s, background .15s; line-height:1; padding:0; }
    .qty-btn:hover { border-color: var(--accent); background: #EEF2FF; color: var(--accent); }
    .qty-btn:disabled { opacity: .4; cursor: not-allowed; }
    .qty-num { min-width: 24px; text-align: center; font-weight: 700; font-size: 14px; }
    .btn-del { width: 26px; height: 26px; border-radius: 6px; border: 1.5px solid #FECACA; background: #FEF2F2; color: var(--red); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s; padding:0; margin: 0 auto; }
    .btn-del:hover { background: #FEE2E2; border-color: var(--red); }
    .btn-del:disabled { opacity: .4; cursor: not-allowed; }
    .price { font-weight: 700; color: var(--accent); text-align: right; }
    .price.zero { color: var(--text-3); font-weight: 400; }
    .stock-ok { color: var(--green); font-size: 12px; text-align: center; }
    .stock-no { color: var(--yellow); font-size: 12px; text-align: center; }
    .totals-block { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px; }
    .totals-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; font-size: 13px; color: var(--text-2); }
    .totals-row span:last-child { font-weight: 600; color: var(--text); }
    .totals-row.tax { font-size: 12px; color: var(--text-3); }
    .totals-row.grand { margin-top: 8px; padding-top: 10px; border-top: 2px solid var(--border); font-size: 16px; font-weight: 800; color: var(--text); }
    .totals-row.grand span { color: var(--accent) !important; font-weight: 900; }
    .action-block { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
    .btn-action { width: 100%; padding: 13px; border: none; border-radius: var(--r-sm); font-size: 15px; font-weight: 700; cursor: pointer; transition: background .15s; }
    .btn-login { background: var(--bg); border: 1.5px solid var(--border); color: var(--accent); }
    .btn-login:hover { background: #EEF2FF; border-color: var(--accent); }
    .btn-pay { background: var(--accent); color: #fff; }
    .btn-pay:hover { background: #2451A0; }
    .empty { text-align: center; padding: 40px; color: var(--text-2); font-size: 14px; }
    .error { text-align: center; padding: 20px; color: #991B1B; font-size: 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { display:inline-block; width:12px; height:12px; border:2px solid rgba(0,0,0,.15); border-top-color: var(--accent); border-radius:50%; animation: spin .5s linear infinite; vertical-align: middle; margin-right: 4px; }
  </style>
</head>
<body>
<div class="card">
  <div class="input-row">
    <input type="text" id="tokenInput" />
  </div>
  <div id="result"></div>
</div>

<script>
var API      = 'https://erpbackend.leiten.dnscheck.com.ar';
var CLAVE    = '2af04ae1-7d3f-4ac0-abb1-10d0360c605a';
var cartToken = '';
var idSesion  = null;
var cartData  = null;

function fmt(n) {
  if (n == null || n === '') return '—';
  return 'U$S ' + (+n).toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function render(c) {
  cartData = c;
  var items = c.items || [];
  var badgeClass = c.estadoCarrito === 'Abierto' ? 'badge-open' : c.estadoCarrito === 'Cerrado' ? 'badge-closed' : 'badge-default';
  var html = '<div class="cart-info"><span class="cart-id">Carrito #' + c.idCarrito + '</span><span class="badge ' + badgeClass + '">' + c.estadoCarrito + '</span><span class="cart-id">' + items.length + ' producto' + (items.length !== 1 ? 's' : '') + '</span></div>';

  if (items.length === 0) {
    html += '<div class="empty">Este carrito no tiene productos.</div>';
  } else {
    html += '<table><thead><tr>' +
      '<th>Producto</th>' +
      '<th style="text-align:center">Cant.</th>' +
      '<th style="text-align:right">Precio unit.</th>' +
      '<th style="text-align:right">Total fila</th>' +
      '<th style="text-align:center">Stock</th>' +
      '<th style="text-align:center"></th>' +
    '</tr></thead><tbody>';

    items.forEach(function(item) {
      var preUni    = item.preUni    != null ? item.preUni    : (item.precioUnitario != null ? item.precioUnitario : (item.precio != null ? item.precio : null));
      var totalFila = item.importeTotal != null ? item.importeTotal : (item.total != null ? item.total : (item.importe != null ? item.importe : null));
      var rowId = 'row-' + item.idItem;

      html += '<tr id="' + rowId + '">' +
        '<td><div class="name">' + item.nombre + '</div><div class="code">' + item.codigo + '</div></td>' +
        '<td>' +
          '<div class="qty-ctrl">' +
            '<button class="qty-btn" data-id="' + item.idItem + '" data-delta="-1" title="Restar">−</button>' +
            '<span class="qty-num" id="qty-' + item.idItem + '">' + item.cantidad + '</span>' +
            '<button class="qty-btn" data-id="' + item.idItem + '" data-delta="1"  title="Sumar">+</button>' +
          '</div>' +
        '</td>' +
        '<td class="' + (preUni    > 0 ? 'price' : 'price zero') + '">' + fmt(preUni)    + '</td>' +
        '<td class="' + (totalFila > 0 ? 'price' : 'price zero') + '">' + fmt(totalFila) + '</td>' +
        '<td class="' + (item.hayStock ? 'stock-ok' : 'stock-no') + '">' + (item.hayStock ? '✓' : '⚠') + '</td>' +
        '<td><button class="btn-del" data-id="' + item.idItem + '" title="Eliminar">🗑</button></td>' +
      '</tr>';
    });
    html += '</tbody></table>';

    var subtotal = c.importeSubTotal != null ? c.importeSubTotal : (c.subTotal != null ? c.subTotal : (c.subtotal != null ? c.subtotal : null));
    var total    = c.importeTotal    != null ? c.importeTotal    : (c.total   != null ? c.total    : null);
    html += '<div class="totals-block">';
    html += '<div class="totals-row"><span>Subtotal sin impuestos</span><span>' + fmt(subtotal) + '</span></div>';
    (c.impuestos || []).filter(function(i){ return i.importe > 0; }).forEach(function(i) {
      html += '<div class="totals-row tax"><span>' + i.nombreAFIP + ' ' + i.alicuota + '%</span><span>' + fmt(i.importe) + '</span></div>';
    });
    html += '<div class="totals-row grand"><span>Total de la compra</span><span>' + fmt(total) + '</span></div>';
    html += '</div>';

    if (idSesion) {
      html += '<div class="action-block"><button class="btn-action btn-pay" id="btnPagar">Ir a pagar</button></div>';
    } else {
      html += '<div class="action-block"><button class="btn-action btn-login" id="btnLogin">Iniciar sesión para continuar</button></div>';
    }
  }

  document.getElementById('result').innerHTML = html;
  bindControls();
}

function bindControls() {
  document.querySelectorAll('.qty-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var idItem = +this.dataset.id;
      var delta  = +this.dataset.delta;
      var qtyEl  = document.getElementById('qty-' + idItem);
      var current = qtyEl ? +qtyEl.textContent : 1;
      var next = current + delta;
      if (next < 1) return;
      updateQty(idItem, next, this);
    });
  });

  document.querySelectorAll('.btn-del').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var idItem = +this.dataset.id;
      deleteItem(idItem, this);
    });
  });

  var btnLogin = document.getElementById('btnLogin');
  if (btnLogin) {
    btnLogin.addEventListener('click', function() {
      // TODO: implementar cuando lleguen las APIs de auth
      alert('Login no disponible aún — endpoint pendiente.');
    });
  }

  var btnPagar = document.getElementById('btnPagar');
  if (btnPagar) {
    btnPagar.addEventListener('click', function() {
      window.parent.postMessage({type: 'GO_CHECKOUT', idSesion: idSesion, cartToken: cartToken}, '*');
    });
  }
}

function updateQty(idItem, nuevaCantidad, triggerBtn) {
  var qtyEl = document.getElementById('qty-' + idItem);
  var prevVal = qtyEl ? qtyEl.textContent : nuevaCantidad;
  if (qtyEl) qtyEl.textContent = nuevaCantidad;
  disableRow(idItem, true);

  fetch(API + '/api/carrito/items/' + idItem, {
    method: 'PUT',
    headers: {'X-API-Key': CLAVE, 'X-Cart-Token': cartToken, 'Content-Type': 'application/json'},
    body: JSON.stringify({cantidad: nuevaCantidad})
  })
  .then(function(r) { if (!r.ok) throw new Error('Error ' + r.status); return r.json(); })
  .then(function(data) { render(data); })
  .catch(function() { if (qtyEl) qtyEl.textContent = prevVal; disableRow(idItem, false); });
}

function deleteItem(idItem, triggerBtn) {
  var row = document.getElementById('row-' + idItem);
  if (row) row.classList.add('removing');

  fetch(API + '/api/carrito/items/' + idItem, {
    method: 'DELETE',
    headers: {'X-API-Key': CLAVE, 'X-Cart-Token': cartToken}
  })
  .then(function(r) { if (!r.ok) throw new Error('Error ' + r.status); return r.json(); })
  .then(function(data) { render(data); })
  .catch(function() { if (row) row.classList.remove('removing'); });
}

function disableRow(idItem, disabled) {
  var row = document.getElementById('row-' + idItem);
  if (!row) return;
  row.querySelectorAll('button').forEach(function(b){ b.disabled = disabled; });
}

function buscar() {
  var token = document.getElementById('tokenInput').value.trim();
  if (!token) return;
  cartToken = token;
  document.getElementById('result').innerHTML = '<div class="empty"><span class="spin"></span>Cargando...</div>';
  fetch(API + '/api/carrito', { headers: {'X-API-Key': CLAVE, 'X-Cart-Token': token} })
  .then(function(r) { if (!r.ok) throw new Error('Error ' + r.status); return r.json(); })
  .then(function(data) { console.log('[Leiten carrito]', JSON.stringify(data)); render(data); })
  .catch(function(e) { document.getElementById('result').innerHTML = '<div class="error">No se pudo obtener el carrito: ' + e.message + '</div>'; });
}

window.addEventListener('message', function(e) {
  if (!e.data) return;
  if (e.data.type === 'SET_TOKEN' && e.data.token) {
    document.getElementById('tokenInput').value = e.data.token;
    buscar();
  }
  if (e.data.type === 'SET_SESSION' && e.data.idSesion) {
    idSesion = e.data.idSesion;
    if (cartData) render(cartData);
  }
});

(function() {
  var fromHash = location.hash ? decodeURIComponent(location.hash.slice(1)) : '';
  var fromStorage = '';
  try { fromStorage = localStorage.getItem('hikoki_cartToken') || ''; } catch(e) {}
  var token = fromHash || fromStorage;
  if (token) { document.getElementById('tokenInput').value = token; buscar(); }
})();
</script>
</body>
</html>
